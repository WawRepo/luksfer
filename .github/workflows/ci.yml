name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version
      - name: Unit tests
        run: LUKSFER_SWIFT=test scripts/build.sh
      - name: Build the app
        run: scripts/build-app.sh
