name: Release

# Push a version tag (git tag v0.1.0 && git push origin v0.1.0) to build the disk image and
# publish it as a GitHub Release, with an attestation: a signed record of the repo, commit and
# workflow that built the file. GitHub makes attestations free only on public repos.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0   # the build number is the commit count
      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version
      - name: Unit tests
        run: LUKSFER_SWIFT=test scripts/build.sh
      - name: Build the disk image
        id: build
        run: |
          scripts/release.sh "$GITHUB_REF_NAME"
          echo "dmg=$HOME/Library/Caches/luksfer-dev/release/Luksfer-${GITHUB_REF_NAME#v}.dmg" >> "$GITHUB_OUTPUT"
      - name: Record that this workflow built the disk image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.dmg }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dist="$HOME/Library/Caches/luksfer-dev/release"
          gh release create "$GITHUB_REF_NAME" --title "Luksfer $version" --generate-notes \
            "$dist/Luksfer-$version.dmg" "$dist/Luksfer-$version.dmg.sha256"
