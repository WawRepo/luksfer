name: Pages

# Publishes the docs site (site/, put together by scripts/build-site.sh) to GitHub Pages when a
# push to main changes it. The repo's Pages setting must use "GitHub Actions" as its source.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-site.sh'
      - 'docs/images/**'
      - 'docs/brand/logo.png'
      - 'Resources/Assets.xcassets/AppIcon.appiconset/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Put the site and its images in one folder
        run: scripts/build-site.sh "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
